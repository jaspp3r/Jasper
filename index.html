<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIQUE BIO EDITOR</title>
    <style>
        :root {
            --bg-color: #08070b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(50, 45, 65, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(20, 18, 30, 0.8) 0%, transparent 50%);
            color: #dcd7e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 440px;
            padding: 22px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(145deg, #181522, #0d0b12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.2),
                0 0 15px rgba(255,255,255,0.08),
                0 8px 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .contact-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.25),
                0 0 20px rgba(255, 255, 255, 0.08),
                0 8px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .contact-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: #7d758d;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Quick Formatting Toolbar (Glassmorphism Raised) */
        .formatting-bar {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.15),
                0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .fmt-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 11px 0;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.2),
                0 4px 12px rgba(0,0,0,0.4);
        }

        .fmt-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        /* Color Bar Trigger */
        .color-trigger-btn {
            width: 100%;
            background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 18px;
            border-radius: 16px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.15),
                0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        /* Editor Input Box (Inset Glass Look) */
        .editor-box {
            background: linear-gradient(145deg, rgba(0,0,0,0.4), rgba(15,12,20,0.6));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.8),
                0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            user-select: text;
        }

        textarea::placeholder {
            color: #5e576e;
        }

        .char-counter {
            text-align: right;
            font-size: 11px;
            color: #5e576e;
            margin-top: 4px;
        }

        /* Live Preview Box (Inset Glass Look) */
        .preview-box {
            background: linear-gradient(145deg, rgba(0,0,0,0.4), rgba(15,12,20,0.6));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            min-height: 110px;
            text-align: left;
            font-size: 16px;
            line-height: 1.7;
            word-break: break-word;
            display: block;
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.8),
                0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        /* Footer Copyright */
        .footer-copyright {
            text-align: center;
            font-size: 13px;
            color: #7a708c;
            margin-top: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* COLOR PICKER MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .color-modal {
            background: #14111c;
            color: #fff;
            width: 90%;
            max-width: 360px;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-label {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
        }

        .color-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            outline: none;
        }

        .color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #a855f7;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #hueSlider {
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
        }

        #satSlider {
            background: linear-gradient(to right, #ffffff, #ff0000);
        }

        #valSlider {
            background: linear-gradient(to right, #000000, #ff0000);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .preset-swatch {
            height: 40px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .modal-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-btn {
            color: #a855f7;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .chosen-preview-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #aaa;
        }

        .chosen-swatch {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #FF0000;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 5px;
        }

        .modal-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
        }

        .btn-cancel { color: #888; }
        .btn-set { color: #a855f7; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="avatar">FF</div>
            <div class="brand-title">UNIQUE BIO</div>
        </div>
        <a href="https://instagram.com/svixter" target="_blank" class="contact-btn">
            <!-- Instagram Glass SVG Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            Jasper
        </a>
    </header>

    <div class="container">
        
        <!-- QUICK FORMATTING -->
        <div class="section-title">✏ QUICK FORMATTING</div>
        <div class="formatting-bar">
            <button class="fmt-btn" onclick="insertTag('b')">B</button>
            <button class="fmt-btn" onclick="insertTag('i')"><i>/</i></button>
            <button class="fmt-btn" onclick="insertTag('u')"><span style="text-decoration: underline;">U</span></button>
            <button class="fmt-btn" onclick="insertTag('s')"><span style="text-decoration: line-through;">S</span></button>
            <button class="fmt-btn" onclick="insertTag('sup')">x²</button>
            <button class="fmt-btn" onclick="insertTag('sub')">x₂</button>
        </div>

        <!-- COLOR SELECTOR BUTTON -->
        <button class="color-trigger-btn" onclick="openModal()">
            <span>🎨 COLOR CODES</span>
            <span>▼</span>
        </button>

        <!-- EDITOR INPUT AREA -->
        <div class="section-title">📝 UNIQUE BIO EDITOR</div>
        <div class="editor-box">
            <textarea id="bioInput" placeholder="put ur code" oninput="renderPreview()"></textarea>
            <div class="char-counter" id="charCounter">0/250</div>
        </div>

        <!-- LIVE PREVIEW AREA -->
        <div class="section-title">🎯 LIVE PREVIEW</div>
        <div class="preview-box" id="livePreview">
            <span style="color:#5e576e">Preview will appear here...</span>
        </div>

        <!-- COPYRIGHT FOOTER -->
        <div class="footer-copyright">
            © Jasper 2026
        </div>

    </div>

    <!-- COLOR PICKER MODAL -->
    <div class="modal-overlay" id="colorModal">
        <div class="color-modal">
            <div class="modal-header">Select color</div>

            <!-- CUSTOM SLIDERS VIEW -->
            <div id="customView" class="slider-group">
                <div>
                    <div class="slider-label">Hue</div>
                    <input type="range" min="0" max="360" value="120" class="color-slider" id="hueSlider" oninput="updateColorFromSliders()">
                </div>
                <div>
                    <div class="slider-label">Saturation</div>
                    <input type="range" min="0" max="100" value="100" class="color-slider" id="satSlider" oninput="updateColorFromSliders()">
                </div>
                <div>
                    <div class="slider-label">Value</div>
                    <input type="range" min="0" max="100" value="100" class="color-slider" id="valSlider" oninput="updateColorFromSliders()">
                </div>
            </div>

            <!-- PRESETS VIEW -->
            <div id="presetsView" class="preset-grid" style="display: none;">
                <div class="preset-swatch" style="background:#FF0000" onclick="selectPreset('#FF0000')"></div>
                <div class="preset-swatch" style="background:#00FFFF" onclick="selectPreset('#00FFFF')"></div>
                <div class="preset-swatch" style="background:#0000FF" onclick="selectPreset('#0000FF')"></div>
                <div class="preset-swatch" style="background:#00FF00" onclick="selectPreset('#00FF00')"></div>
                <div class="preset-swatch" style="background:#FF00FF" onclick="selectPreset('#FF00FF')"></div>
                <div class="preset-swatch" style="background:#FFFF00" onclick="selectPreset('#FFFF00')"></div>
                <div class="preset-swatch" style="background:#000000" onclick="selectPreset('#000000')"></div>
                <div class="preset-swatch" style="background:#FFFFFF" onclick="selectPreset('#FFFFFF')"></div>
            </div>

            <div class="modal-tabs">
                <button class="tab-btn" id="toggleTabBtn" onclick="toggleColorTab()">Suggestions</button>
                <div class="chosen-preview-wrap">
                    <span>Chosen color</span>
                    <div class="chosen-swatch" id="chosenSwatch"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-set" onclick="applySelectedColor()">Set</button>
            </div>
        </div>
    </div>

    <script>
        let selectedHex = "FF0000";
        let isCustomMode = true;

        function openModal() {
            document.getElementById('colorModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('colorModal').classList.remove('active');
        }

        function toggleColorTab() {
            isCustomMode = !isCustomMode;
            const customView = document.getElementById('customView');
            const presetsView = document.getElementById('presetsView');
            const tabBtn = document.getElementById('toggleTabBtn');

            if (isCustomMode) {
                customView.style.display = 'flex';
                presetsView.style.display = 'none';
                tabBtn.innerText = 'Suggestions';
            } else {
                customView.style.display = 'none';
                presetsView.style.display = 'grid';
                tabBtn.innerText = 'Custom';
            }
        }

        function hsvToHex(h, s, v) {
            s /= 100; v /= 100;
            let c = v * s;
            let x = c * (1 - Math.abs((h / 60) % 2 - 1));
            let m = v - c;
            let r = 0, g = 0, b = 0;

            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }

            let red = Math.round((r + m) * 255).toString(16).padStart(2, '0');
            let green = Math.round((g + m) * 255).toString(16).padStart(2, '0');
            let blue = Math.round((b + m) * 255).toString(16).padStart(2, '0');

            return (red + green + blue).toUpperCase();
        }

        function updateColorFromSliders() {
            const h = document.getElementById('hueSlider').value;
            const s = document.getElementById('satSlider').value;
            const v = document.getElementById('valSlider').value;

            const baseHex = hsvToHex(h, 100, 100);
            document.getElementById('satSlider').style.background = `linear-gradient(to right, #FFFFFF, #${baseHex})`;
            document.getElementById('valSlider').style.background = `linear-gradient(to right, #000000, #${baseHex})`;

            selectedHex = hsvToHex(h, s, v);
            document.getElementById('chosenSwatch').style.backgroundColor = '#' + selectedHex;
        }

        function selectPreset(hex) {
            selectedHex = hex.replace('#', '').toUpperCase();
            document.getElementById('chosenSwatch').style.backgroundColor = '#' + selectedHex;
        }

        function applySelectedColor() {
            const textarea = document.getElementById('bioInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            const colorTag = `[${selectedHex}]`;
            textarea.value = text.substring(0, start) + colorTag + text.substring(end);
            
            textarea.selectionStart = textarea.selectionEnd = start + colorTag.length;
            textarea.focus();
            renderPreview();
            closeModal();
        }

        function insertTag(tag) {
            const textarea = document.getElementById('bioInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            const tagText = `[${tag}]`;
            textarea.value = text.substring(0, start) + tagText + text.substring(end);
            
            textarea.selectionStart = textarea.selectionEnd = start + tagText.length;
            textarea.focus();
            renderPreview();
        }

        function renderPreview() {
            const text = document.getElementById('bioInput').value;
            document.getElementById('charCounter').innerText = `${text.length}/250`;

            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            html = html.replace(/\[([0-9a-fA-F]{6})\]/g, '<span style="color:#$1">');
            
            html = html.replace(/\[b\]/gi, '<b>').replace(/\[\/b\]/gi, '</b>');
            html = html.replace(/\[i\]/gi, '<i>').replace(/\[\/i\]/gi, '</i>');
            html = html.replace(/\[u\]/gi, '<u>').replace(/\[\/u\]/gi, '</u>');
            html = html.replace(/\[s\]/gi, '<s>').replace(/\[\/s\]/gi, '</s>');
            html = html.replace(/\[sup\]/gi, '<sup>').replace(/\[\/sup\]/gi, '</sup>');
            html = html.replace(/\[sub\]/gi, '<sub>').replace(/\[\/sub\]/gi, '</sub>');

            document.getElementById('livePreview').innerHTML = html || '<span style="color:#5e576e">Preview will appear here...</span>';
        }

        updateColorFromSliders();
    </script>
</body>
</html>
